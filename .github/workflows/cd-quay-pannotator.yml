name: CD Build and Push Image to Quay.io to use in Pannotator
on:
  push:
    tags: ["v*pannotator*"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    name: Build and push Docker image to quay.io
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Sanitize the tag
        id: prep
        run: |
          RAW_TAG=${GITHUB_REF#refs/tags/}
          TAG_NO_V=${RAW_TAG#v}
          CLEAN_TAG=${TAG_NO_V//+/-}
          echo "tag=${CLEAN_TAG}" >> $GITHUB_OUTPUT
      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          file: ./Dockerfile_pannotator
          push: true
          build-args: |
            BAKTA_TAG=${{ github.ref_name }}
          tags: quay.io/d_goryslavets/bakta_pannotator:${{ steps.prep.outputs.tag }}, quay.io/d_goryslavets/bakta_pannotator:latest
